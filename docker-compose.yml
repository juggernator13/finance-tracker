name: finance

services:
  web:
    build:
      context: .
      dockerfile: src/Clients/Finance.Web/Dockerfile
    environment:
      Services__Identity: http://identity:8080
      Services__Accounts: http://accounts:8080
      Services__Import: http://import:8080
    ports:
      - "127.0.0.1:5004:8080"
    depends_on:
      - identity
      - accounts
      - import

  import:
    build:
      context: .
      dockerfile: src/Services/Finance.Import/Dockerfile
    environment:
      ConnectionStrings__Default: Host=import-db;Port=5432;Database=${IMPORT_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Services__Accounts__BaseUrl: http://accounts:8080
    ports:
      - "127.0.0.1:5003:8080"
    depends_on:
      import-db:
        condition: service_healthy
      accounts:
        condition: service_started

  import-db:
    image: postgres:16.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${IMPORT_DB}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - import-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${IMPORT_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  accounts:
    build:
      context: .
      dockerfile: src/Services/Finance.AccountsTransactions/Dockerfile
    environment:
      ConnectionStrings__Default: Host=accounts-db;Port=5432;Database=${ACCOUNTS_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    ports:
      - "127.0.0.1:5002:8080"
    depends_on:
      accounts-db:
        condition: service_healthy

  identity:
    build:
      context: .
      dockerfile: src/Services/Finance.Identity/Dockerfile
    environment:
      ConnectionStrings__Default: Host=identity-db;Port=5432;Database=${IDENTITY_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    ports:
      - "127.0.0.1:5001:8080"
    depends_on:
      identity-db:
        condition: service_healthy

  identity-db:
    image: postgres:16.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${IDENTITY_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${IDENTITY_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  accounts-db:
    image: postgres:16.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${ACCOUNTS_DB}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - accounts-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${ACCOUNTS_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13.7-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.1
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  identity-db-data:
  accounts-db-data:
  import-db-data: